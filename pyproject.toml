[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "splatter"
version = "0.1.0"
description = "Fresnel + FSPL coverage engine (PyO3 extension)"
requires-python = ">=3.11"

[tool.maturin]
module-name = "splatter._core"
python-source = "python"
features = ["extension-module"]
