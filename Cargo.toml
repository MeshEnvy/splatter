[package]
name = "splatter"
version = "0.1.0"
edition = "2021"
description = "Fresnel + FSPL coverage raster (drop-in SPLAT-shaped outputs)"
license = "MIT"

[[bin]]
name = "splatter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4.18", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
statrs = "0.17"
