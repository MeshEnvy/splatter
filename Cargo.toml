[package]
name = "splatter"
version = "0.1.0"
edition = "2021"
description = "Fresnel + FSPL coverage raster (drop-in SPLAT-shaped outputs)"
license = "MIT"

[lib]
name = "splatter"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "splatter"
path = "src/main.rs"

[features]
default = []
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
anyhow = "1"
clap = { version = "4.4.18", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
pyo3 = { version = "0.22", optional = true }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
statrs = "0.17"

[profile.release]
lto = true
codegen-units = 1
